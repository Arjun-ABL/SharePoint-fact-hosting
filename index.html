<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Governance Facts</title>

  <style>
    :root {
      /* Brand colours */
      --navy: #002855;
      --green: #79c300;
      --blue: #81c1cc;
      --teal: #0ac49a;

      /* Supporting colours */
      --white: #ffffff;
      --text: #33475b;
      --border: #d4e4e7;

      /*
        Four facts at eight seconds each.
        Total cycle: 32 seconds.
      */
      --cycle-duration: 32s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 2px;
    }

    .fact-card {
      position: relative;
      width: 100%;
      height: 520px;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 40, 85, 0.12);
    }

    /*
      Branded line across the top.
    */
    .fact-card::before {
      content: "";
      position: absolute;
      z-index: 10;
      top: 0;
      right: 0;
      left: 0;
      height: 6px;
      background:
        linear-gradient(
          90deg,
          var(--navy) 0%,
          var(--blue) 38%,
          var(--teal) 70%,
          var(--green) 100%
        );
    }

    /*
      Each fact occupies the same space.
    */
    .fact-slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateX(24px);
      pointer-events: none;

      animation-name: cycleFacts;
      animation-duration: var(--cycle-duration);
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }

    /*
      Each fact begins eight seconds after the previous fact.
    */
    .fact-slide:nth-child(1) {
      animation-delay: 0s;
    }

    .fact-slide:nth-child(2) {
      animation-delay: 8s;
    }

    .fact-slide:nth-child(3) {
      animation-delay: 16s;
    }

    .fact-slide:nth-child(4) {
      animation-delay: 24s;
    }

    /*
      Each slide uses 25% of the complete cycle.
    */
    @keyframes cycleFacts {
      0% {
        opacity: 0;
        visibility: hidden;
        transform: translateX(24px);
        pointer-events: none;
      }

      2% {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
        pointer-events: auto;
      }

      22% {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
        pointer-events: auto;
      }

      25% {
        opacity: 0;
        visibility: hidden;
        transform: translateX(-24px);
        pointer-events: none;
      }

      100% {
        opacity: 0;
        visibility: hidden;
        transform: translateX(-24px);
        pointer-events: none;
      }
    }

    /*
      Pause while someone is reading or using the source link.
    */
    .fact-card:hover .fact-slide,
    .fact-card:focus-within .fact-slide {
      animation-play-state: paused;
    }

    .fact-image-wrapper {
      position: relative;
      flex: 0 0 315px;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          var(--navy),
          #064d7d
        );
    }

    .fact-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /*
      Branded overlay helps images from different sources
      appear more visually consistent.
    */
    .fact-image-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          135deg,
          rgba(0, 40, 85, 0.18),
          rgba(10, 196, 154, 0.06)
        ),
        linear-gradient(
          to top,
          rgba(0, 40, 85, 0.22),
          transparent 55%
        );
      pointer-events: none;
    }

    .fact-content {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: 25px 32px 27px;
      background: var(--white);
    }

    /*
      Small branded accent beside the fact.
    */
    .fact-content::before {
      content: "";
      position: absolute;
      top: 27px;
      bottom: 29px;
      left: 0;
      width: 5px;
      background:
        linear-gradient(
          to bottom,
          var(--teal),
          var(--green)
        );
      border-radius: 0 999px 999px 0;
    }

    .fact-text {
      margin: 0;
      color: var(--text);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.65;
    }

    .fact-text strong {
      color: var(--navy);
      font-weight: 700;
    }

      align-items: center;
      gap: 7px;
